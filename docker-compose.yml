services:
  backend:
    build: ./backend
    image: jagan395/vehicle-detection:backend
    container_name: fastapi_app
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    image: jagan395/vehicle-detection:frontend
    container_name: streamlit_app
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://backend:8000/detect
    depends_on:
      - backend
